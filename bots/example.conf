# botkit bot config. Copy to bots/<name>.conf and edit.
#
# TRACKED TEMPLATE. Do not put a real host, user, or mount path in this file.
# git will commit it. Copy it first. `bot` refuses to run against the name
# `example` on purpose.
#
# Shell-sourceable KEY=value. No logic, no command substitution. The filename
# must match BOT_NAME: bots/robot.conf holds BOT_NAME=robot.
#
# This file is the only .conf tracked by git. Yours are ignored.

# BOT_NAME is the local nickname. It must match this filename:
# bots/example.conf holds BOT_NAME=example. After you copy this file,
# bots/robot.conf holds BOT_NAME=robot. It is not a login.
BOT_NAME=example

# How you reach the robot. ssh and sshfs both use BOT_USER@BOT_HOST.
#
# If the robot's shell prompt is `user@robot`, that is BOT_USER@hostname.
# BOT_USER=user. BOT_HOST is whichever of `robot`, `robot.local`, or an IP
# actually pings from this laptop. `.local` is mDNS (Avahi), not something
# botkit adds. On the robot, `whoami` is BOT_USER and `hostname` is the
# machine's name.
#
# BOT_USER is a Linux account on the robot. On a shared lab machine that
# is often a shared account, not the username on this laptop.
BOT_HOST=robot.local
BOT_USER=user

# ---------------------------------------------------------------------------
# REMOTE_MOUNT -- what gets mounted. Required, no default.
# ---------------------------------------------------------------------------
#
# botkit does not choose this for you, because the right answer differs per
# robot and the cost of a bad guess is paid on every single search.
#
# Run `bot probe <name>` first. It reports, read-only, over ssh: the robot's
# top-level directory sizes, every directory that looks like a ROS 2 workspace
# with its build/install/log sizes and package count, how many bags and model
# weights are lying around, and how many files a recursive search would have to
# walk with and without the artifact directories.
#
# Then decide, roughly along these lines:
#
#   A workspace (/home/user/ws)
#     Fast, scoped searches. Right when the probe shows a big home directory,
#     lots of bags, or work that only ever happens in one workspace.
#
#   The home directory (/home/user)
#     Robust when you do not yet know the layout, when config outside the
#     workspace matters, or when work spans several workspaces. Costs search
#     breadth, which SEARCH_EXCLUDE below has to contain.
#
# Write the reason, the probe numbers, and the timed search counts into
# ~/dev/notes/<name>/decisions.md. Not into the botkit repo. That one is public.
REMOTE_MOUNT=

# Where it appears on the laptop. Defaults to $HOME/dev/<name>/mount
# inside that bot's laptop project. Do not set this to $HOME/dev/<name>
# itself. That path is the project, not the mount.
MOUNT_POINT=$HOME/dev/example/mount

# The colcon workspace on the robot. `bot run` and `bot build` cd here first.
REMOTE_WS=/home/user/ws

BUILD_CMD="colcon build --symlink-install"
SOURCE_CMD="source /opt/ros/humble/setup.bash && source $REMOTE_WS/install/setup.bash"

# Paths under the mount the agent should never search. Written into Claude
# Code deny rules on install and on every `bot up`, and listed in AGENTS.md
# for every other agent.
#
# Entries without a `*` match a directory name anywhere under the mount.
# Entries with a `*` match filenames. Widen this if you mount a home directory.
SEARCH_EXCLUDE="build install log .ros bags *.bag *.mcap *.pt *.onnx .cache .git"

# Laptop clones that belong with this robot. Space-separated names under
# ~/dev/<BOT_NAME>/, which you clone yourself. Not mounts, not on the robot.
#
# The usual case is a GUI: after `bot up` has created ~/dev/robot/,
# git clone <gui-url> ~/dev/robot/gui
# then LOCAL_REPOS=gui
#
# `bot up` seeds notes/<name>/ for each entry, and will move a leftover
# ~/dev/<repo> into ~/dev/<bot>/<repo> if the old location still exists.
# Names mount, notes, and docs are reserved.
LOCAL_REPOS=
